<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0d9488">
<title>E-Mail bestätigen — FahrDoc</title>
<link rel="icon" href="/app/icon-192.png">
<link rel="apple-touch-icon" href="/app/apple-touch-icon.png">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(180deg, #f8fafb 0%, #eef4f5 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    color: #1a1a1a;
  }
  .card {
    background: #ffffff;
    border-radius: 20px;
    padding: 48px 32px;
    max-width: 440px;
    width: 100%;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.06);
  }
  .logo {
    font-size: 28px;
    margin-bottom: 8px;
  }
  h1 {
    font-size: 22px;
    margin: 16px 0 8px 0;
  }
  p {
    color: #555;
    line-height: 1.5;
    font-size: 15px;
    margin: 8px 0 0 0;
  }
  .icon {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    margin: 0 auto 16px auto;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
  }
  .icon.loading { background: #f0f4f8; }
  .icon.success { background: #d1fae5; color: #047857; }
  .icon.error { background: #fee2e2; color: #b91c1c; }
  .spinner {
    width: 28px; height: 28px;
    border: 3px solid #e5e7eb;
    border-top-color: #0d9488;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn {
    display: inline-block;
    background: #0d9488;
    color: #ffffff;
    font-size: 16px;
    font-weight: 600;
    padding: 14px 36px;
    border-radius: 10px;
    text-decoration: none;
    border: none;
    cursor: pointer;
    margin-top: 24px;
    transition: background 0.15s;
  }
  .btn:hover { background: #0f766e; }
  .btn-secondary {
    background: #f3f4f6;
    color: #1a1a1a;
  }
  .btn-secondary:hover { background: #e5e7eb; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">🚗 FahrDoc</div>
  <div id="state-loading">
    <div class="icon loading"><div class="spinner"></div></div>
    <h1>E-Mail wird bestätigt…</h1>
    <p>Einen Moment bitte.</p>
  </div>
  <div id="state-success" style="display:none;">
    <div class="icon success">✓</div>
    <h1>E-Mail bestätigt</h1>
    <p>Dein Konto ist jetzt aktiv. Du wirst zur Anmeldeseite weitergeleitet…</p>
    <a class="btn" href="/app/">Jetzt anmelden</a>
  </div>
  <div id="state-error" style="display:none;">
    <div class="icon error">!</div>
    <h1>Bestätigung fehlgeschlagen</h1>
    <p id="error-msg">Der Bestätigungslink ist ungültig oder abgelaufen.</p>
    <a class="btn btn-secondary" href="/app/">Zurück zur Anmeldung</a>
  </div>
</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var token = params.get('token');
  var uid = params.get('uid');
  var role = params.get('role');

  function show(id, msg) {
    document.getElementById('state-loading').style.display = 'none';
    document.getElementById('state-success').style.display = id === 'success' ? 'block' : 'none';
    document.getElementById('state-error').style.display = id === 'error' ? 'block' : 'none';
    if (msg && id === 'error') document.getElementById('error-msg').textContent = msg;
  }

  if (!token || !uid || !role) {
    show('error', 'Der Bestätigungslink ist unvollständig.');
    return;
  }

  var url = '/api/auth/verify-link?token=' + encodeURIComponent(token) + '&uid=' + encodeURIComponent(uid) + '&role=' + encodeURIComponent(role);
  fetch(url)
    .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
    .then(function(res) {
      if (res.ok && res.data && res.data.success) {
        show('success');
        // Auto-redirect to login after 2.5 seconds
        setTimeout(function() {
          window.location.href = '/app/?verified=1';
        }, 2500);
      } else {
        var msg = (res.data && res.data.error) ? res.data.error : 'Unbekannter Fehler.';
        show('error', msg);
      }
    })
    .catch(function() {
      show('error', 'Verbindungsfehler. Bitte versuche es erneut.');
    });
})();
</script>
</body>
</html>
